[package]
name = "agents-hub"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1"
base64 = "0.22"
portable-pty = "0.9"
ratatui = "0.30"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "io-std", "process", "sync", "time", "fs"] }
toml = "0.8"
# vt100 comes from tui-term's re-export on purpose: a separate version pin here can
# drift out of sync on re-resolve and yield two vt100 crates in one graph.
tui-term = "0.3"

[profile.release]
lto = true
